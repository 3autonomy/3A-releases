name: Publish Tablet Release

on:
  repository_dispatch:
    types: [tablet-release]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact from source repo
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.client_payload.component }}-${{ github.event.client_payload.version }}
          github-token: ${{ secrets.SOURCE_REPOS_TOKEN }}
          repository: ${{ github.event.client_payload.source_repo }}
          run-id: ${{ github.event.client_payload.run_id }}

      - name: Download existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p existing
          gh release download latest -D existing 2>/dev/null || true

      - name: Update tablet manifest
        run: |
          # Use existing tablet-manifest.json or create new one
          if [ -f existing/tablet-manifest.json ]; then
            cp existing/tablet-manifest.json tablet-manifest.json
          else
            echo '{"schema_version":1,"apps":{}}' > tablet-manifest.json
          fi

          python3 -c "
          import json
          from datetime import datetime, timezone
          m = json.load(open('tablet-manifest.json'))
          m['updated_at'] = datetime.now(timezone.utc).isoformat()
          m['apps']['${{ github.event.client_payload.component }}'] = {
              'name': '${{ github.event.client_payload.name }}',
              'packageName': '${{ github.event.client_payload.package }}',
              'version_code': ${{ github.event.client_payload.version_code }},
              'version_name': '${{ github.event.client_payload.version }}',
              'artifact': '${{ github.event.client_payload.component }}-${{ github.event.client_payload.version }}.apk',
              'sha256': '${{ github.event.client_payload.sha256 }}'
          }
          json.dump(m, open('tablet-manifest.json', 'w'), indent=2)
          "
          echo "Updated tablet-manifest.json:"
          cat tablet-manifest.json

      - name: Republish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove old tablet manifest and old version of this component from existing
          rm -f existing/tablet-manifest.json
          rm -f existing/${{ github.event.client_payload.component }}-*.apk

          # Delete old latest release
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          # Collect all assets: new tablet-manifest + all remaining existing + new APK
          ASSETS=(tablet-manifest.json)
          for f in existing/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          ASSETS+=(${{ github.event.client_payload.component }}-${{ github.event.client_payload.version }}.apk)

          gh release create latest \
            --title "MIRA Platform Latest Release" \
            --notes "Updated: $(date -Iseconds)" \
            "${ASSETS[@]}"
